# Cloudflare Tunnel Configuration for WireGuard VPN
# This allows you to expose your WireGuard server through Cloudflare without port forwarding

tunnel: 278d633b-37a9-42ee-93c5-621173cc8ab5
credentials-file: /path/to/your/tunnel/credentials.json

# Ingress rules - order matters!
ingress:
  # Route VPN traffic through Cloudflare Tunnel
  - hostname: vpn.sashi.live
    service: udp://localhost:51820
    originRequest:
      # Optimize for VPN traffic
      noTLSVerify: true
      connectTimeout: 30s
      tlsTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 10

  # WireGuard Easy Web interface for management
  - hostname: ag-admin.sashi.online
    service: http://localhost:51821
    originRequest:
      # Bypass RFC1918 IP restrictions
      noTLSVerify: true
      # Set proper host header to match the service
      httpHostHeader: localhost
      # Connection settings for web interface
      connectTimeout: 60s
      tlsTimeout: 60s
      # Disable chunked encoding which can cause issues
      disableChunkedEncoding: true
      # Allow HTTP/1.1 for better compatibility
      http2Origin: false

  # Catch-all rule (required)
  - service: http_status:404

# Disable Warp routing to avoid RFC1918 conflicts
warp-routing:
  enabled: false

# Logging configuration
loglevel: info

# Additional tunnel settings to handle RFC1918 traffic
# These settings help bypass Cloudflare's private IP restrictions
no-autoupdate: true